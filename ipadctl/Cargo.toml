[package]
name = "ipadctl"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/gui"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
nix = { version = "0.31.3", features = ["term", "poll", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
